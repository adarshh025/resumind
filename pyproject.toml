[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "resumind"
version = "0.1.0"
description = "Intelligent Resume Analysis & Structured Extraction Engine"
authors = [
    { name = "Adarsh Aher", email = "aheradarsh6@gmail.com" }
]
license = "MIT"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "spacy>=3.7.0",
    "pdfminer.six>=20231228",
    "python-docx>=1.1.0",
    "pydantic>=2.7.0",
    "fastapi>=0.110.0",
    "uvicorn>=0.29.0",
    "python-multipart>=0.0.9"
]

[project.optional-dependencies]
api = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.29.0"
]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.3.0",
    "mypy>=1.9.0"
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
